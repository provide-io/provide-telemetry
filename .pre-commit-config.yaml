# Hooks with no `stages:` of their own default to running at EVERY stage,
# commit-msg included -- so with a commit-msg hook type installed, a single
# `git commit` ran this whole battery twice. This scopes them to the two stages
# that matter; the commit-msg and manual hooks declare their own and are
# unaffected.
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-format
        name: ruff format
      - id: ruff
        name: ruff lint
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]
        # pyproject's codespell skip lists ./rust/Cargo.lock and friends, but
        # pre-commit passes paths without the ./ so those never match here.
        exclude: "(package-lock\\.json|Cargo\\.lock|uv\\.lock)$"

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  - repo: local
    hooks:
      - id: max-loc
        name: python max loc
        # 777 to match ci-python.yml. The cap was raised there and in the
        # allowlist by ca9853c6 but missed here, so the hook rejected 14 files
        # CI accepts -- unnoticed for a month because the hooks were never
        # installed. Keep the two in step.
        entry: uv run python scripts/check_max_loc.py --max-lines 777
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: spdx-header-check
        name: python spdx header check
        entry: uv run python scripts/check_spdx_headers.py
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: event-literal-check
        name: telemetry event literal check
        entry: uv run python scripts/check_event_literals.py
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: spdx-header-normalize
        name: python spdx header normalize (manual)
        entry: uv run python scripts/normalize_spdx_headers.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        types: [python]

      - id: ty
        name: ty check
        entry: uv run ty check src tests
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: mypy
        name: mypy strict
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: bandit
        name: bandit
        entry: uv run bandit -r src -ll
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      # The same audit as CI's dependency-audit job: the committed lock, with
      # pip-audit from a tool environment. `python -m pip_audit` needed
      # pip-audit in the project venv, which no dependency group declares, so
      # any `uv sync` removed it and the hook failed with "No module named
      # pip_audit".
      - id: pip-audit
        name: pip-audit (vulnerability scan)
        entry: uv run python ci/audit_python.py
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: xenon
        name: xenon complexity
        entry: uv run xenon --max-absolute C --max-modules B --max-average A src/
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: vulture
        name: vulture dead code
        entry: uv run vulture src/ tests/
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: check-licenses
        name: license check
        entry: uv run python scripts/check_licenses.py
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: mutation-gate
        name: mutmut gate (manual)
        entry: uv run python scripts/run_mutation_gate.py --python-version 3.11 --max-children 4 --retries 1
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        types: [python]

      - id: performance-smoke
        name: performance smoke (manual)
        entry: uv run python scripts/run_performance_smoke.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        types: [python]

      # ── TypeScript package (typescript/) ───────────────────────────────────
      - id: ts-typecheck
        name: typescript type check
        entry: bash -c 'cd typescript && npm run typecheck && npm run typecheck:examples'
        language: system
        pass_filenames: false
        always_run: true
        files: ^typescript/

      - id: ts-lint
        name: typescript lint (eslint)
        entry: bash -c 'cd typescript && npm run lint'
        language: system
        pass_filenames: false
        always_run: true
        files: ^typescript/src/|^typescript/tests/

      - id: ts-format-check
        name: typescript format check (prettier)
        entry: bash -c 'cd typescript && npm run format:check'
        language: system
        pass_filenames: false
        always_run: true
        files: ^typescript/src/|^typescript/tests/

      - id: ts-test
        name: typescript tests (vitest)
        entry: bash -c 'cd typescript && npm run test'
        language: system
        pass_filenames: false
        always_run: true
        files: ^typescript/

      # ── Rust crate (rust/) ────────────────────────────────────────────────
      - id: rust-fmt
        name: rust format check
        entry: bash -c 'cd rust && cargo fmt --check'
        language: system
        pass_filenames: false
        always_run: true
        files: ^rust/

      - id: rust-clippy
        name: rust clippy
        entry: bash -c 'cd rust && cargo clippy --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        always_run: true
        files: ^rust/

      - id: rust-test
        name: rust tests
        entry: bash -c 'cd rust && cargo test'
        language: system
        pass_filenames: false
        always_run: true
        files: ^rust/

      # ── Go library and contract probe (go/, spec/probes/contract_probe_go/) ──
      - id: go-fmt
        name: go format check
        entry: bash -c 'test -z "$(gofmt -l go/ spec/probes/contract_probe_go/)"'
        language: system
        pass_filenames: false
        always_run: true
        files: ^go/|^spec/probes/contract_probe_go/

      - id: go-vet
        name: go vet
        entry: bash -c 'cd go && go vet ./...'
        language: system
        pass_filenames: false
        always_run: true
        files: ^go/|^spec/probes/contract_probe_go/

      - id: go-test
        name: go tests
        entry: bash -c 'cd go && go test ./...'
        language: system
        pass_filenames: false
        always_run: true
        files: ^go/
