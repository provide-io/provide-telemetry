[package]
name = "provide-telemetry"
version = "0.11.0"
edition = "2021"
rust-version = "1.89"
description = "Cross-language telemetry helpers with privacy, resilience, and OTLP support."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/provide-io/provide-telemetry"
homepage = "https://github.com/provide-io/provide-telemetry"
keywords = ["telemetry", "observability", "opentelemetry", "otlp"]
categories = ["development-tools::debugging"]

[lib]
name = "provide_telemetry"
path = "src/lib.rs"

[features]
default = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:reqwest",
    "dep:tokio-stream",
    "dep:url",
]
# OTLP/gRPC transport. Additive on top of `otel` (which brings HTTP/protobuf).
otel-grpc = ["otel", "opentelemetry-otlp/grpc-tonic", "opentelemetry-otlp/tls-aws-lc", "dep:http"]
# The Tier 3 standalone Prometheus listener: a small HTTP(S) server on its own
# thread, with the web config's TLS (rustls) and bcrypt basic auth. Implies
# `otel`, which owns the pull reader the listener serves.
prometheus-listener = [
    "otel",
    "dep:base64",
    "dep:bcrypt",
    "dep:rustls",
    "dep:serde-saphyr",
]

[dependencies]
base64 = { version = "0.23", optional = true }
bcrypt = { version = "0.19", optional = true }
hmac = "0.13"
http = { version = "1.1", optional = true, default-features = false, features = ["std"] }
log = "0.4"
opentelemetry = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", optional = true, default-features = false, features = ["http-proto", "http-json", "reqwest-client", "trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", optional = true, features = ["rt-tokio", "logs", "metrics", "trace", "experimental_logs_batch_log_processor_with_async_runtime", "experimental_metrics_custom_reader", "experimental_metrics_periodicreader_with_async_runtime", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-semantic-conventions = { version = "0.33", optional = true }
percent-encoding = "2.3.1"
rand = "0.10"
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["blocking", "json", "rustls"] }
regex = "1.11.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Pure Rust, with input budgets: the web config it reads is operator-supplied.
serde-saphyr = { version = "1.3", optional = true, default-features = false, features = ["deserialize"] }
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.44", features = ["rt", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }
url = { version = "2", optional = true }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
# base64 and mutants are here rather than in [dependencies] because nothing a
# consumer links against uses them: base64 is only reached from the OpenObserve
# examples, and `mutants::skip` only ever appears under `#[cfg_attr(test, ..)]`,
# which is off when the crate is built as a dependency.
base64 = "0.23"
criterion = { version = "0.8", features = ["html_reports"] }
mutants = "0.0.4"
# Views, for a test that drives an exponential histogram through the pull
# reader; feature unification turns them on for test builds only.
opentelemetry_sdk = { version = "0.33", features = ["spec_unstable_metrics_views"] }
proptest = "1"
# Certificates for the TLS tests (listener web config, OTLP client TLS).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
rstest = "0.27"
serde-saphyr = "1.3"
tokio = { version = "1.44", features = ["macros"] }

[[bench]]
name = "hot_path"
harness = false

[[example]]
name = "emit_log_probe"

[[example]]
name = "contract_probe"

[[example]]
name = "telemetry_14_data_governance"
