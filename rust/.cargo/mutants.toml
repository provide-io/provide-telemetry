# Canonical cargo-mutants configuration for the Rust library.
# cargo-mutants reads `.cargo/mutants.toml` by default from the crate root:
# https://mutants.rs/config-file.html
#
# The auto timeout is 5x the unmutated baseline, and that is too tight for
# mutants that break the export-health observations: every polling test in
# tests/otlp_runtime_test.rs then burns its full wait_for_export_health
# deadline plus its fixed sleeps, and the aggregate run blows a cap derived
# from the healthy suite's runtime. On a fast machine (20s baseline -> 99s
# cap) three health.rs mutants timed out undecided; at 15x all are decided
# and killed. Same reasoning as the Go gate's --timeout-coefficient=100:
# this raises how long a mutant may take to be judged, not the bar, which is
# still zero survivors.
timeout_multiplier = 15.0

# The Windows console module. cargo-mutants parses the AST and does not honour
# cfg gates — the same blindness noted below for #[path]-included test modules —
# so on the Linux runner it generates mutants for a #[cfg(windows)] body that
# never compiles there, and every one of them survives by construction rather
# than through a gap in the tests.
#
# Excluded whole rather than by mutant name because the platform arms share
# function names, so a name regex cannot tell the Windows dispatcher from the
# portable one. What the file holds is dispatch and three kernel32 calls; the
# thing that decides whether ANSI is emitted at all — the is_terminal guard —
# was an inline call before this module existed and was not mutated then
# either, so the gate loses nothing it had.
#
# Stated plainly: no automated test exercises the interop. Its Go counterpart is
# asserted against a real console screen buffer in the Go suite, which is the
# one place in this repository that can allocate one.
exclude_globs = ["src/logger/windows_console.rs"]

# Equivalent mutations: excluded because the mutated code is
# behaviourally identical to the original.
exclude_re = [
    # consent.rs: "TRACE" => 0 and the catch-all `_ => 0` both return 0.
    # Deleting the TRACE arm produces no observable change in behaviour.
    'delete match arm "TRACE" in log_level_order',
    # setup.rs / testing.rs: OnceLock::get_or_init initializers for static
    # Mutexes. Replacing them with Box::leak is still a single shared static
    # allocation and cannot be distinguished in black-box tests.
    'replace setup_state -> &.* with Box::leak',
    'replace test_state_lock -> &.* with Box::leak',
    # classification.rs: these constructor rewrites and redundant-star
    # collapse changes are behaviorally identical.
    'default_policy_mutex.*Default::default',
    'empty_rules_mutex.*vec!\\[\\]',
    'src/classification.rs:139:29: replace < with > in match_glob::glob_match',
    # config.rs: the += -> *= / -= mutants in has_invalid_percent_encoding pin
    # idx at 0 and hang instead of producing a distinguishable result. The
    # function is covered; only the infinite-loop arithmetic mutants are
    # excluded.
    'replace \+= with \*= in has_invalid_percent_encoding',
    'replace \+= with -= in has_invalid_percent_encoding',
    # propagation.rs:96 traceparent length guard: a valid W3C traceparent is exactly
    # 55 chars, so any string with length > MAX_HEADER_LENGTH (512) cannot be valid.
    # parse_traceparent flattens every malformed input to (None, None, None), making
    # the closure's `Some(value)` vs `None` intermediate state observationally
    # identical for all inputs — no test can distinguish `>` from `>=` here.
    'src/propagation.rs:96:24: replace > with >= in extract_w3c_context',
    'src/propagation.rs:96:24: replace > with == in extract_w3c_context',
    # bounded_flush_tests.rs blocked_until_for: the wait loop's `elapsed < cap`
    # vs `<=` differs only when elapsed equals the cap to the nanosecond — one
    # extra 5ms sleep at most, indistinguishable from scheduler noise. (The
    # file is a #[cfg(test)] module, but cargo-mutants does not honor the cfg
    # gate on #[path]-included modules, so its helpers are mutated like src.)
    'replace < with <= in blocked_until_for',
]
