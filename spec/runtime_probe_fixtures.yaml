cases:
  - id: lazy_init_logger
    kind: record
    expected:
      message: "log.output.parity"
      level: "INFO"
      service: "probe"
      env: "parity"
      version: "1.2.3"
      logger_name: "probe"
      trace_id: "0af7651916cd43dd8448eb211c80319c"
      span_id: "b7ad6b7169203331"

  - id: lazy_logger_shutdown_re_setup
    kind: flags
    expected:
      first_logger_emitted: true
      shutdown_cleared_setup: true
      shutdown_cleared_providers: true
      shutdown_fallback_all: true
      re_setup_done: true
      second_logger_uses_fresh_config: true

  - id: strict_schema_rejection
    kind: flags
    expected:
      emitted: true
      schema_error: true

  # PROVIDE_CONSENT_LEVEL=NONE is read by setup and by the lazy logger path, so
  # an operator opt-out takes effect without any code change. Both probes emit
  # one INFO record and must see consent at NONE and nothing written.
  - id: consent_env_none_at_setup
    kind: flags
    expected:
      setup_done: true
      consent_none: true
      record_suppressed: true

  - id: consent_env_none_lazy_logger
    kind: flags
    expected:
      consent_none: true
      record_suppressed: true

  # PROVIDE_CONSENT_LEVEL=NOEN — set, non-empty, unrecognised — must fail
  # closed: consent becomes NONE and the record is suppressed, on the lazy
  # logger path with no setup call at all.
  - id: consent_env_invalid_fails_closed
    kind: flags
    expected:
      consent_none: true
      record_suppressed: true

  - id: strict_event_name_only
    kind: flags
    expected:
      emitted: true
      schema_error: true

  - id: required_keys_rejection
    kind: flags
    expected:
      emitted: true
      schema_error: true

  - id: invalid_config
    kind: flags
    expected:
      raised: true

  - id: fail_open_exporter_init
    kind: flags
    expected:
      setup_done: true
      providers_cleared: true
      fallback_all: true

  - id: signal_enablement
    kind: flags
    expected:
      setup_done: true
      logs_enabled: true
      traces_enabled: false
      metrics_enabled: false

  - id: per_signal_logs_endpoint
    kind: flags
    expected:
      setup_done: true
      logs_provider: true
      traces_provider: false
      metrics_provider: false

  - id: provider_identity_reconfigure
    kind: flags
    expected:
      providers_active: true
      raised: true
      config_preserved: true

  # A host application's own SDK provider, adopted by the facade. The mechanism
  # is per-language on purpose — Python, TypeScript and Go detect a live
  # provider on the OTel globals for themselves, while Rust cannot (its
  # GlobalTracerProvider is opaque, with no downcast and no is_noop) and so
  # takes an explicit assertion from the host. The observable contract below is
  # identical for all four. See behavioral_parity.provider_adoption_reporting.
  - id: host_provider_adoption
    kind: flags
    expected:
      # Before setup nothing has read the environment, so the signal defaults
      # on and the host's provider is reported.
      adopted_before_setup: true
      # A setup that leaves the signal on must not drop the adoption.
      adopted_after_enabled_setup: true
      # A *loaded* config that switches the signal off must: status has to
      # match the emit path, which checks enablement first.
      fallback_after_disabled_setup: true

  # Metric output, compared across all four languages. Until this case existed
  # nothing anywhere asserted a counter, gauge or histogram value — only
  # providers.metrics / metrics_enabled flags — so metrics were the one signal
  # with zero cross-language verification of what they actually produce.
  #
  # Values are reported as strings on purpose. The native types differ by
  # language and that is idiomatic, not a defect: Python's Counter.add takes an
  # int and Gauge.set an int, Go's Counter.Add takes int64 and Gauge.Set
  # float64, Rust takes f64 throughout. Comparing raw JSON numbers would fail on
  # 7 vs 7.0 and say nothing about correctness. The values chosen are exact in
  # every representation, so the strings compare cleanly.
  - id: metric_instrument_values
    kind: flags
    expected:
      # counter: add 1, 2, 4
      counter_value: "7"
      # gauge: set 42 (single attribute set — Gauge.value aggregates across
      # attribute sets in Python and returns last-reading elsewhere, a
      # documented capability difference; one set is where they agree)
      gauge_value: "42"
      # histogram: record 1, 2, 3
      histogram_count: "3"
      histogram_total: "6"

  - id: shutdown_re_setup
    kind: flags
    expected:
      first_setup_done: true
      shutdown_cleared_setup: true
      shutdown_cleared_providers: true
      shutdown_fallback_all: true
      re_setup_done: true
      signals_match: true
      providers_match: true

  # ── Hot-reload logging parity (Claim 3 coverage) ────────────────────────
  # All four languages expose update_runtime_config({logging: ...}) which
  # must rebuild the logging pipeline so level/format/module-level changes
  # take effect on the next log event without touching provider-wiring
  # fields. These three cases probe that contract end-to-end.

  - id: hot_reload_log_level
    kind: flags
    expected:
      first_debug_suppressed: true
      second_debug_emitted: true
      level_config_updated: true
      service_preserved: true

  - id: hot_reload_log_format
    kind: flags
    expected:
      format_config_updated: true
      service_preserved: true
      providers_unchanged: true

  - id: hot_reload_module_level
    kind: flags
    expected:
      first_debug_suppressed: true
      module_debug_emitted: true
      module_levels_config_updated: true
      service_preserved: true
