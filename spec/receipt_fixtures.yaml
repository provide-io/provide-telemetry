#
# Canonical governance receipt vectors — the cross-language contract.
#
# Every SDK must reproduce, byte for byte:
#   canonical_json  RFC 8785 (JCS) serialization of `normalized`
#   original_hash   lowercase hex SHA-256 of the canonical_json bytes
#   payload         receipt_id|timestamp|field_path|action|original_hash
#   signature       lowercase hex HMAC-SHA256 of payload under `key`
#
# `input` is the value as captured; `normalized` is what canonicalization runs
# on. They differ only where JCS cannot encode the input — NaN and Infinity have
# no JSON representation, so the contract fixes that they normalize to null
# rather than leaving each SDK to invent a spelling.
#
# The digests here are derived with `rfc8785`, an independent implementation;
# tests/tooling/test_receipt_fixtures.py re-derives them on every run. Python's
# json.dumps is NOT a valid verifier: it emits "-0.0" where JCS requires "0",
# which the negative_zero_collapses case pins deliberately.

