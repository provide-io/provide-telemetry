name: 📐 CI — Contract Parity

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "ci/**"
      - "src/provide/telemetry/**"
      - "typescript/src/**"
      - "go/**"
      - "rust/src/**"
      - "rust/examples/contract_probe.rs"
      - "VERSION"
      - ".github/workflows/ci-contracts.yml"
      - "csharp/src/**"
      - "infra/prometheus/**"
      - "e2e/test_prometheus_push_e2e.py"
      - "scripts/prometheus_push_probe.py"
      - "typescript/scripts/prometheus-push-probe.ts"
      - "rust/examples/prometheus_push_probe.rs"
      - "csharp/probes/PrometheusPushProbe/**"
  # No paths filter: this workflow owns required status contexts, so it must
  # always run. The per-area gating lives on the jobs -- see the changes job.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which areas this change touches. This workflow owns required status
  # contexts, so it must always run: a workflow that never runs reports
  # nothing, and a context that never reports blocks the merge forever. A job
  # skipped by `if:` reports as skipped, which GitHub counts as satisfied.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      contracts: ${{ steps.detect.outputs.contracts }}
    steps:
      # Full history so the base of the comparison is present
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          fetch-depth: 0
      # Decide which areas the diff touches; an undetectable diff reports every area
      - id: detect
        run: ci/changed-areas.sh "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"

  # Cross-language log output format parity — runs all 4 language parity suites
  # then compares canonical JSON fields (message, level, service, env, version, trace_id).
  output-parity:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      # Python runtime for the orchestrator and Python parity tests
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.11"
      # Node.js runtime for TypeScript parity tests
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      # Go runtime for Go parity tests
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26"
      # .NET 10 for C# parity — required, not optional: a missing runtime is
      # now a hard failure rather than a silent skip.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "10.0.x"
      # Rust toolchain for Rust parity tests
      # Pinned SHA of dtolnay/rust-toolchain `stable` branch HEAD as of 2026-04-18.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable@2026-04-18
        with:
          toolchain: stable
      # Cache Cargo registry and build artifacts to speed up Rust compilation
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: rust
      # Install Python and TypeScript dependencies
      - name: Install dependencies
        run: python ci/install_parity_deps.py
      # Run all five language parity suites with strict defaults: output-format probes
      # are on by default.  --skip-output disables if needed for ad-hoc debugging.
      - name: Behavioral parity check (output format)
        run: uv run python spec/run_behavioral_parity.py --skip-contracts

  # Contract probe DSL — step-based cross-language semantic tests that exercise real
  # public APIs (setup, bind_propagation, emit_log, clear_propagation, etc.) and
  # cross-compare observable outputs across all five languages.
  contract-probes:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      # Python runtime for the orchestrator and Python contract probe
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.11"
      # Node.js runtime for TypeScript contract probe
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      # Go runtime for Go contract probe
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26"
      # .NET 10 for C# parity — required, not optional: a missing runtime is
      # now a hard failure rather than a silent skip.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "10.0.x"
      # Rust toolchain for Rust contract probe
      # Pinned SHA of dtolnay/rust-toolchain `stable` branch HEAD as of 2026-04-18.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable@2026-04-18
        with:
          toolchain: stable
      # Cache Cargo registry and build artifacts to speed up Rust compilation
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: rust
      # Install Python and TypeScript dependencies
      - name: Install dependencies
        run: python ci/install_parity_deps.py
      # Run all 6 contract cases across all 5 languages and cross-compare results.
      # Cases exercise: propagation→logger correlation, trace field precedence,
      # config validation, lifecycle, baggage injection, propagation cleanup.
      # Contract checks are on by default; --skip-output skips the output probes
      # so this job only runs contract cases.
      - name: Contract probe check (cross-language semantics)
        run: uv run python spec/run_behavioral_parity.py --skip-output

  # Tier 1 of the Prometheus contract (spec: prometheus_metrics): every SDK's
  # ordinary OTLP metrics exporter pushes to a real Prometheus 3 OTLP receiver,
  # and the series are read back through the Prometheus HTTP API. Names, labels
  # and values are checked against spec/prometheus_fixtures.yaml push_ingestion.
  prometheus-push:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.11"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "10.0.x"
      # Pinned SHA of dtolnay/rust-toolchain `stable` branch HEAD as of 2026-04-18.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable@2026-04-18
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: rust
      # Python (with the otel extra) and TypeScript dependencies
      - name: Install dependencies
        run: python ci/install_parity_deps.py
      # Same image version and flags as the prometheus service in docker-compose.yml
      - name: Start Prometheus 3 with the OTLP receiver
        run: |
          docker run -d --name prometheus \
            -p 127.0.0.1:9090:9090 \
            -v "$PWD/infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v3.13.4 \
            --config.file=/etc/prometheus/prometheus.yml \
            --web.enable-otlp-receiver
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9090/-/ready && exit 0
            sleep 1
          done
          docker logs prometheus
          exit 1
      # PROVIDE_E2E_REQUIRE_ALL_RUNTIMES turns a missing toolchain into a failure
      # rather than a skip, so a language that never ran cannot pass.
      - name: Push from every SDK and verify in Prometheus
        env:
          PROMETHEUS_URL: "http://127.0.0.1:9090"
          PROVIDE_E2E_REQUIRE_ALL_RUNTIMES: "1"
        run: uv run python scripts/run_pytest_gate.py -m e2e --no-cov -q e2e/test_prometheus_push_e2e.py
      - name: Prometheus logs
        if: always()
        run: docker logs prometheus || true
