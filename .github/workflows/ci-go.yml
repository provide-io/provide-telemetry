name: 🐹 CI — Go

on:
  push:
    paths:
      - "go/**"
      - "ci/**"
      - "VERSION"
      - ".github/workflows/ci-go.yml"
      - "baselines/perf-go.json"
      - "scripts/perf_check.py"
  pull_request:
    paths:
      - "go/**"
      - "ci/**"
      - "VERSION"
      - ".github/workflows/ci-go.yml"
      - "baselines/perf-go.json"
      - "scripts/perf_check.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26"
      - name: Generate temporary go.work
        shell: bash
        run: |
          WORKFILE="$("$GITHUB_WORKSPACE/ci/init-go-workspace.sh" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/provide-telemetry-go-work")"
          echo "GOWORK=${WORKFILE}" >> "$GITHUB_ENV"
          export GOWORK="${WORKFILE}"
          echo "Using workspace: ${WORKFILE}"
          go env GOWORK
      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out .
      - name: Enforce 100% coverage
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Total coverage: $TOTAL"
          if [ "$TOTAL" != "100.0%" ]; then
            echo "FAIL: coverage is $TOTAL, expected 100.0%"
            exit 1
          fi

  workspace-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26"
      - name: Generate temporary go.work
        shell: bash
        run: |
          WORKFILE="$("$GITHUB_WORKSPACE/ci/init-go-workspace.sh" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/provide-telemetry-go-work")"
          echo "GOWORK=${WORKFILE}" >> "$GITHUB_ENV"
          export GOWORK="${WORKFILE}"
          echo "Using workspace: ${WORKFILE}"
          go env GOWORK
      - name: Run go/logger tests with coverage
        if: ${{ hashFiles('go/logger/go.mod') != '' }}
        working-directory: go
        run: go test -race -coverprofile=logger.coverage.out ./logger/...
      - name: Enforce go/logger 100% coverage
        if: ${{ hashFiles('go/logger/go.mod') != '' }}
        working-directory: go
        run: |
          TOTAL=$(go tool cover -func=logger.coverage.out | grep total | awk '{print $3}')
          echo "Total coverage: $TOTAL"
          if [ "$TOTAL" != "100.0%" ]; then
            echo "FAIL: coverage is $TOTAL, expected 100.0%"
            exit 1
          fi
      - name: Confirm root module stays free of OTel SDK and exporter deps
        if: ${{ hashFiles('go/otel/go.mod') != '' }}
        working-directory: go
        run: |
          pattern='go\.opentelemetry\.io/(contrib/bridges/otelslog|otel/exporters/|otel/sdk|otel/log|otel/metric)'
          if command -v rg >/dev/null 2>&1; then
            matcher=(rg -n "$pattern" go.mod)
          else
            matcher=(grep -nE "$pattern" go.mod)
          fi
          if "${matcher[@]}"; then
            echo "FAIL: root go module should not depend on OTel SDK, exporters, bridge, logs, or metric modules"
            exit 1
          fi
          echo "OK: root go module stays on core/API-only dependencies"
      - name: Run go/otel tests with coverage
        if: ${{ hashFiles('go/otel/go.mod') != '' }}
        working-directory: go/otel
        run: go test -race -coverprofile=coverage.out .
      - name: Enforce go/otel 100% coverage
        if: ${{ hashFiles('go/otel/go.mod') != '' }}
        working-directory: go/otel
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Total coverage: $TOTAL"
          if [ "$TOTAL" != "100.0%" ]; then
            echo "FAIL: coverage is $TOTAL, expected 100.0%"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26"
      - name: Generate temporary go.work
        shell: bash
        run: |
          WORKFILE="$("$GITHUB_WORKSPACE/ci/init-go-workspace.sh" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/provide-telemetry-go-work")"
          echo "GOWORK=${WORKFILE}" >> "$GITHUB_ENV"
          export GOWORK="${WORKFILE}"
          echo "Using workspace: ${WORKFILE}"
          go env GOWORK
      # Build golangci-lint v2 from source — v2 module path supports Go 1.25 and the v2 config format.
      # Pre-built binaries are Go 1.24 and refuse Go 1.25; v1 module path ignores v2 config.
      #
      # Pinned, not @latest. With a floating version this job's verdict changes
      # when upstream ships a release, so a commit that touched no Go code can
      # turn the branch red — which is exactly what happened here: a new
      # `exhaustive` and `gocyclo` pass flagged harden.go, unmodified for weeks.
      # A lint gate that cannot be reproduced locally is not a gate. Bump this
      # deliberately, with the new findings fixed in the same commit.
      - name: Install golangci-lint (v2)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Run golangci-lint
        run: golangci-lint run --path-prefix=go
        working-directory: go
      # go/otel is its own module, so the root run above never sees it. It
      # inherits go/.golangci.yml and reports paths relative to that file, so
      # the prefix is still "go" — "go/otel" would double the directory.
      - name: Run golangci-lint (go/otel)
        run: golangci-lint run --path-prefix=go
        working-directory: go/otel

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26"
          # Without this, "1.26" resolves to the runner image's cached patch
          # release. govulncheck then reports already-fixed stdlib vulns as
          # blocking (GO-2026-5972 fired on cached 1.26.5 after 1.26.6 shipped
          # the fix), so the vuln scanner must always run the newest patch.
          check-latest: true
      - name: Generate temporary go.work
        shell: bash
        run: |
          WORKFILE="$("$GITHUB_WORKSPACE/ci/init-go-workspace.sh" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/provide-telemetry-go-work")"
          echo "GOWORK=${WORKFILE}" >> "$GITHUB_ENV"
          export GOWORK="${WORKFILE}"
          echo "Using workspace: ${WORKFILE}"
          go env GOWORK
      - name: Install security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run gosec
        # Exclude cmd/e2e_cross_language_client — separate module requiring Go 1.26, only used for E2E
        run: gosec -exclude-dir=cmd/e2e_cross_language_client ./...
      - name: Run govulncheck
        # Scan the library package only — examples are demo code, not library, and their
        # transitive TLS usage should not block library releases.
        env:
          # setup-go resolves from actions/go-versions, which lags go.dev
          # releases — 1.26.6 shipped the GO-2026-5972 fix while the manifest
          # still topped out at 1.26.5, so check-latest alone cannot reach the
          # patched stdlib. GOTOOLCHAIN fetches the pinned toolchain straight
          # from go.dev. Bump it whenever a stdlib vuln fix lands.
          GOTOOLCHAIN: go1.26.6
        run: govulncheck .
      # go/otel is its own module and was never scanned: the root `./...` stops
      # at the module boundary. Its examples and probe are small enough to scan whole.
      - name: Run gosec (go/otel)
        working-directory: go/otel
        run: gosec ./...
      # Same toolchain pin as the root step, for the same reason — the vuln
      # scanner must see the newest patched stdlib, not the runner's cache.
      - name: Run govulncheck (go/otel)
        working-directory: go/otel
        env:
          GOTOOLCHAIN: go1.26.6
        run: govulncheck ./...

  vet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26"
      - name: Generate temporary go.work
        shell: bash
        run: |
          WORKFILE="$("$GITHUB_WORKSPACE/ci/init-go-workspace.sh" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/provide-telemetry-go-work")"
          echo "GOWORK=${WORKFILE}" >> "$GITHUB_ENV"
          export GOWORK="${WORKFILE}"
          echo "Using workspace: ${WORKFILE}"
          go env GOWORK
      - name: Run go vet
        run: go vet ./...
      # go/otel is its own module; `./...` from go/ does not descend into it.
      - name: Run go vet (go/otel)
        working-directory: go/otel
        run: go vet ./...

  performance-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26"
      # uv provides a consistent Python invocation across OSes for the
      # perf_check.py + parse_go_bench.py pipeline. This job only benchmarks
      # the root module, so it stays in the workflow default `GOWORK=off`
      # mode instead of entering workspace mode.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.11"
      # Run all benchmarks (-benchtime=100ms ≈ 1.5s total wall time) and pipe
      # through parse_go_bench → perf_check, which compares each per-op timing
      # against baselines/perf-go.json for this runner's OS bucket. Missing
      # buckets exit 0 with a hint so seeding via CI is straightforward.
      - name: Run perf gate
        shell: bash
        run: go test -bench=. -benchtime=100ms -run=^$ . | uv run --no-project python ../scripts/parse_go_bench.py | uv run --no-project python ../scripts/perf_check.py --lang go

  examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26"
      - name: Generate temporary go.work
        shell: bash
        run: |
          WORKFILE="$("$GITHUB_WORKSPACE/ci/init-go-workspace.sh" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/provide-telemetry-go-work")"
          echo "GOWORK=${WORKFILE}" >> "$GITHUB_ENV"
          export GOWORK="${WORKFILE}"
          echo "Using workspace: ${WORKFILE}"
          go env GOWORK
      # Build and run each standalone telemetry example (no live backend required)
      - name: Run telemetry examples
        run: |
          set -euo pipefail
          for d in examples/telemetry/*/; do
            echo "running $d"
            go run ./"$d"
          done
      - name: Build go/otel OpenObserve examples
        run: |
          if [ -d ./otel/examples/openobserve ]; then
            go build ./otel/examples/openobserve/...
          elif [ -d ./examples/openobserve ]; then
            go build ./examples/openobserve/...
          else
            echo "No OpenObserve examples present"
          fi

  otlp-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26"
      - name: Generate temporary go.work
        shell: bash
        run: |
          WORKFILE="$("$GITHUB_WORKSPACE/ci/init-go-workspace.sh" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/provide-telemetry-go-work")"
          echo "GOWORK=${WORKFILE}" >> "$GITHUB_ENV"
          export GOWORK="${WORKFILE}"
          echo "Using workspace: ${WORKFILE}"
          go env GOWORK
      - name: Prepare collector output directory
        run: |
          mkdir -p ../tests/integration/otel-output-go
          rm -f ../tests/integration/otel-output-go/*.json
      - name: Start OTLP collector
        run: |
          docker run -d --name otelcol-go \
            -p 127.0.0.1:4318:4318 \
            -p 127.0.0.1:13133:13133 \
            -v "$PWD/../tests/integration/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.102.1
      - name: Wait for collector health
        run: ../ci/wait-for-collector.sh
      - name: Run collector-backed OTLP smoke test
        run: |
          if [ -f ./otel/go.mod ]; then
            (cd ./otel && go test -run TestOTLPCollectorSmoke .)
          else
            go test -run TestOTLPCollectorSmoke .
          fi
        env:
          PROVIDE_TEST_OTLP_ENDPOINT: "http://127.0.0.1:4318"
          PROVIDE_TEST_OTLP_OUTPUT_DIR: "${{ github.workspace }}/tests/integration/otel-output-go"
      # Flush must put records on the wire without tearing providers down. Run
      # as a separate process that never calls ShutdownTelemetry, so anything it
      # lands in the collector can only have got there via flush.
      - name: Run collector-backed flush probe
        working-directory: go/otel
        run: go run ./cmd/flush_collector_probe
        env:
          PROVIDE_TEST_OTLP_ENDPOINT: "http://127.0.0.1:4318"
      - name: Collector logs
        if: always()
        run: docker logs otelcol-go || true
      - name: Capture collector logs
        run: docker logs otelcol-go > ../tests/integration/otel-output-go/collector.log 2>&1
      # Poll the collector log until every required signal name appears, with
      # a 30s deadline (see ci/verify-collector-signals.sh for rationale).
      - name: Verify collector exported all signals
        env:
          OTELCOL_CONTAINER: otelcol-go
        run: ../ci/verify-collector-signals.sh ../tests/integration/otel-output-go/collector.log
      # Names alone prove only that something arrived. This asserts the payload:
      # the right service resource, native trace/span correlation on log records,
      # and no internal library state exported as an attribute.
      - name: Verify collector content
        run: python3 ../ci/verify-collector-content.py ../tests/integration/otel-output-go/collector.log provide-telemetry-go-integration
      - name: Stop collector
        if: always()
        run: |
          docker stop otelcol-go || true
          docker rm otelcol-go || true
