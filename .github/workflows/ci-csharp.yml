name: 🟣 CI — C#

on:
  push:
    paths:
      - "csharp/**"
      - "VERSION"
      - ".github/workflows/ci-csharp.yml"
      - "baselines/perf-csharp.json"
      - "scripts/perf_check.py"
  pull_request:
    paths:
      - "csharp/**"
      - "VERSION"
      - ".github/workflows/ci-csharp.yml"
      - "baselines/perf-csharp.json"
      - "scripts/perf_check.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "10.0.x"
      - name: Check formatting
        run: dotnet format Provide.Telemetry.sln --verify-no-changes
      - name: Build (warnings as errors)
        run: dotnet build Provide.Telemetry.sln -warnaserror
      # The OpenObserve E2E test self-skips when OPENOBSERVE_* env vars are
      # absent, so the whole suite runs unfiltered here.
      - name: Run tests with coverage
        run: >
          dotnet test Provide.Telemetry.sln --no-build
          --collect:"XPlat Code Coverage"
          --results-directory "$RUNNER_TEMP/cscov"
      # Floors ratchet up, never down. Line is 100 exact (measured 2026-08-14:
      # 100.00% across 831 tests) — the former exception, the circuit breaker's
      # half-open transitions, is closed by the Resilience.Clock TimeProvider
      # seam, and the teardown guard is unit-tested directly. Branch floor is
      # 98 under a measured 98.20%: the remaining partial branches are
      # defensive null-coalescing arms and lock double-checks only a race can
      # take, plus DI-shape lambda arms in the OTel drain wiring.
      - name: Enforce coverage floor
        run: python3 ../ci/check_csharp_coverage.py "$RUNNER_TEMP/cscov" --line-floor 100 --branch-floor 98

  # Blocks on any vulnerable NuGet package, transitive included, in every
  # project of the solution. Restores first so an unrestored solution cannot
  # report an empty — and therefore falsely clean — package list.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "10.0.x"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.11"
      - run: uv run python ci/audit_csharp.py

  examples-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "10.0.x"
      # Built once so the smoke script's --no-build runs are just launches.
      - name: Build solution (Release)
        run: dotnet build csharp/Provide.Telemetry.sln -c Release -warnaserror
      # Execute every standalone telemetry example — the build proves they
      # compile, this proves they run. OpenObserve examples need a live
      # backend and stay in the shared E2E workflow.
      - name: Run telemetry examples
        run: bash ci/run-csharp-example-smoke.sh

  # Packs both NuGet packages into a throwaway local feed and consumes them the
  # way a customer would — exact-version PackageReference, no ProjectReference,
  # our package ids confined to that feed by packageSourceMapping — then builds
  # and runs both consumers. A ProjectReference compiles the source tree and
  # proves nothing about the packed artifact.
  package-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "10.0.x"
      - run: ./ci/verify-csharp-consumer-packages.sh

  performance-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: csharp
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "10.0.x"
      # uv provides a consistent Python invocation across the three runner OSes
      # for the perf_check.py step, exactly as the Go and Rust perf jobs do.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.11"
      # Built as its own step, not folded into the gate command: MSBuild writes
      # progress to stdout and would otherwise be piped into perf_check.py in
      # place of the measurements.
      - name: Build benchmark runner
        run: dotnet build perf/Provide.Telemetry.Perf/Provide.Telemetry.Perf.csproj -c Release -warnaserror
      # Compares each per-op timing against baselines/perf-csharp.json for this
      # runner's OS bucket. macos-arm64 and windows-x86_64 are unseeded, so
      # those legs exit 0 with a hint printing the numbers to paste in.
      - name: Run perf gate
        run: dotnet run --no-build -c Release --project perf/Provide.Telemetry.Perf/Provide.Telemetry.Perf.csproj -- --iterations 300000 --runs 5 --emit-json | uv run --no-project python ../scripts/perf_check.py --lang csharp
