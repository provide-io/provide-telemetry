name: 🟣 CI — C#

on:
  push:
    paths:
      - "csharp/**"
      - "VERSION"
      - ".github/workflows/ci-csharp.yml"
      - "baselines/perf-csharp.json"
      - "scripts/perf_check.py"
  pull_request:
    paths:
      - "csharp/**"
      - "VERSION"
      - ".github/workflows/ci-csharp.yml"
      - "baselines/perf-csharp.json"
      - "scripts/perf_check.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "10.0.x"
      - name: Check formatting
        run: dotnet format Provide.Telemetry.sln --verify-no-changes
      - name: Build (warnings as errors)
        run: dotnet build Provide.Telemetry.sln -warnaserror
      # The OpenObserve E2E test self-skips when OPENOBSERVE_* env vars are
      # absent, so the whole suite runs unfiltered here.
      - name: Run tests with coverage
        run: >
          dotnet test Provide.Telemetry.sln --no-build
          --collect:"XPlat Code Coverage"
          --results-directory "$RUNNER_TEMP/cscov"
      # Floors are the measured coverage of the whole run (2026-08-08:
      # 99.60% line, 97.94% branch across 685 tests), floored to integers with a
      # little headroom — ratchet them up, never down. What is left uncovered is
      # the circuit breaker's half-open transitions, which need a 30-second
      # cooldown to elapse and would need an injectable clock to reach, plus a
      # handful of defensive null-coalescing arms and lock double-checks that
      # only a race can take.
      - name: Enforce coverage floor
        run: |
          python3 - "$RUNNER_TEMP/cscov" <<'EOF'
          import glob, re, sys, xml.etree.ElementTree as ET
          from collections import defaultdict

          # Both test projects instrument the core assembly, so each emits its
          # own report and neither is complete on its own. Reading just one --
          # the directories are random GUIDs, so "just one" means whichever
          # sorts last -- was a coin flip between a 68% report and a 32% one.
          # Merge every report and take the union: a line is covered if any
          # suite reached it.
          reports = glob.glob(f"{sys.argv[1]}/**/coverage.cobertura.xml", recursive=True)
          if not reports:
              sys.exit("FAIL: no coverage.cobertura.xml produced")

          lines = defaultdict(dict)  # source file -> line number -> (hits, covered, total)
          for report in reports:
              for cls in ET.parse(report).getroot().iter("class"):
                  filename = cls.get("filename") or ""
                  if "Provide.Telemetry" not in filename:
                      continue
                  for line in cls.iter("line"):
                      number = int(line.get("number"))
                      hits = int(line.get("hits"))
                      fraction = re.search(r"\((\d+)/(\d+)\)", line.get("condition-coverage") or "")
                      covered, total = (int(fraction[1]), int(fraction[2])) if fraction else (0, 0)
                      previous = lines[filename].get(number, (0, 0, 0))
                      lines[filename][number] = (
                          max(previous[0], hits), max(previous[1], covered), max(previous[2], total))

          measured = [entry for file_lines in lines.values() for entry in file_lines.values()]
          if not measured:
              sys.exit("FAIL: no Provide.Telemetry classes found in the coverage reports")
          line_rate = sum(1 for hits, _, _ in measured if hits) / len(measured) * 100
          branch_total = sum(total for _, _, total in measured)
          branch_rate = sum(covered for _, covered, _ in measured) / branch_total * 100

          print(f"{len(lines)} files, {len(measured)} lines, {branch_total} branches")
          print(f"line: {line_rate:.2f}% (floor 99), branch: {branch_rate:.2f}% (floor 97)")
          if line_rate < 99 or branch_rate < 97:
              sys.exit("FAIL: coverage fell below the recorded baseline")
          EOF

  examples-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "10.0.x"
      # Built once so the smoke script's --no-build runs are just launches.
      - name: Build solution (Release)
        run: dotnet build csharp/Provide.Telemetry.sln -c Release -warnaserror
      # Execute every standalone telemetry example — the build proves they
      # compile, this proves they run. OpenObserve examples need a live
      # backend and stay in the shared E2E workflow.
      - name: Run telemetry examples
        run: bash ci/run-csharp-example-smoke.sh

  performance-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: csharp
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "10.0.x"
      # uv provides a consistent Python invocation across the three runner OSes
      # for the perf_check.py step, exactly as the Go and Rust perf jobs do.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8
        with:
          python-version: "3.11"
      # Built as its own step, not folded into the gate command: MSBuild writes
      # progress to stdout and would otherwise be piped into perf_check.py in
      # place of the measurements.
      - name: Build benchmark runner
        run: dotnet build perf/Provide.Telemetry.Perf/Provide.Telemetry.Perf.csproj -c Release -warnaserror
      # Compares each per-op timing against baselines/perf-csharp.json for this
      # runner's OS bucket. macos-arm64 and windows-x86_64 are unseeded, so
      # those legs exit 0 with a hint printing the numbers to paste in.
      - name: Run perf gate
        run: dotnet run --no-build -c Release --project perf/Provide.Telemetry.Perf/Provide.Telemetry.Perf.csproj -- --iterations 300000 --runs 5 --emit-json | uv run --no-project python ../scripts/perf_check.py --lang csharp
