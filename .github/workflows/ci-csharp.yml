name: 🟣 CI — C#

on:
  push:
    paths:
      - "csharp/**"
      - "VERSION"
      - ".github/workflows/ci-csharp.yml"
  pull_request:
    paths:
      - "csharp/**"
      - "VERSION"
      - ".github/workflows/ci-csharp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "10.0.x"
      - name: Build (warnings as errors)
        run: dotnet build Provide.Telemetry.sln -warnaserror
      # The OpenObserve E2E test self-skips when OPENOBSERVE_* env vars are
      # absent, so the whole suite runs unfiltered here.
      - name: Run tests with coverage
        run: >
          dotnet test Provide.Telemetry.sln --no-build
          --collect:"XPlat Code Coverage"
          --results-directory "$RUNNER_TEMP/cscov"
      # Thresholds are the measured baseline at introduction (73.42% line,
      # 53.72% branch), floored to integers — ratchet them up, never down.
      - name: Enforce coverage floor
        run: |
          python3 - "$RUNNER_TEMP/cscov" <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          reports = sorted(glob.glob(f"{sys.argv[1]}/**/coverage.cobertura.xml", recursive=True))
          if not reports:
              sys.exit("FAIL: no coverage.cobertura.xml produced")
          root = ET.parse(reports[-1]).getroot()
          line = float(root.get("line-rate")) * 100
          branch = float(root.get("branch-rate")) * 100
          print(f"line: {line:.2f}% (floor 73), branch: {branch:.2f}% (floor 53)")
          if line < 73 or branch < 53:
              sys.exit("FAIL: coverage fell below the introduction baseline")
          EOF
