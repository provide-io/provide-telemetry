name: 🟦 CI — TypeScript

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - "VERSION"
      - ".github/workflows/ci-typescript.yml"
      - "baselines/perf-typescript.json"
      - "scripts/perf_check.py"
      - ".github/actions/setup-openobserve/**"
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - "VERSION"
      - ".github/workflows/ci-typescript.yml"
      - "baselines/perf-typescript.json"
      - "scripts/perf_check.py"
      - ".github/actions/setup-openobserve/**"
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  typescript-quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      # uv is needed for the perf-gate comparator (scripts/perf_check.py).
      # Matches the rest of this repo's CI; perf_check uses only stdlib so no
      # additional Python deps are installed (no `uv sync` here).
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.11"
      - name: SPDX header check
        shell: bash
        run: |
          MISSING=""
          for f in $(find src tests -name '*.ts' -not -path '*/node_modules/*'); do
            if ! head -3 "$f" | grep -q 'SPDX-License-Identifier'; then
              MISSING="$MISSING\n  $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "Missing SPDX headers:$MISSING"
            exit 1
          fi
          echo "All TypeScript files have SPDX headers"
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      # Pack the package and import every entry point from a real Node
      # consumer. lint, typecheck and vitest all resolve specifiers the way a
      # bundler does, and stayed green while the published ESM was unloadable
      # by Node, so this is the only step that can catch a bad emitted
      # specifier or a packaging gap. Bash-only: the probe is not portable to
      # the Windows runner's default shell.
      - name: Verify npm consumer package
        if: runner.os != 'Windows'
        shell: bash
        run: bash ../ci/verify-npm-consumer-package.sh
      # Pipe perf-smoke output through perf_check.py — compares each measurement
      # against baselines/perf-typescript.json for this runner's OS bucket. Missing
      # buckets exit 0 with a hint so seeding via CI is straightforward.
      - name: Run perf gate
        shell: bash
        run: npx tsx scripts/perf-smoke.ts --emit-json | uv run --no-project python ../scripts/perf_check.py --lang typescript

  # Blocks on any npm advisory across the full production+dev graph. The
  # package-count floor makes an empty or failed audit fail rather than read
  # as a clean scan.
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
      # Install from the lockfile so the audited graph is the committed one.
      - run: npm ci
        working-directory: typescript
      - run: ./ci/audit_typescript.sh

  typescript-examples-smoke:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      # Run all standalone telemetry examples (no live backend required)
      - name: Run telemetry examples
        run: |
          set -euo pipefail
          for f in examples/telemetry/*.ts; do
            echo "running $f"
            npx tsx "$f"
          done
      - name: Setup OpenObserve
        uses: ./.github/actions/setup-openobserve
      # Run OpenObserve examples against a live local instance
      - name: Run OpenObserve examples
        env:
          OPENOBSERVE_REQUIRED_SIGNALS: logs,traces,metrics
        run: |
          set -euo pipefail
          for f in examples/openobserve/*.ts; do
            echo "running $f"
            npx tsx "$f"
          done
      - name: OpenObserve logs
        if: always()
        run: docker logs openobserve-local || true

  typescript-otlp-integration:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Prepare collector output directory
        run: |
          mkdir -p ../tests/integration/otel-output-typescript
          rm -f ../tests/integration/otel-output-typescript/*.json
      - name: Start OTLP collector
        run: |
          docker run -d --name otelcol-typescript \
            -p 127.0.0.1:4318:4318 \
            -p 127.0.0.1:13133:13133 \
            -v "$PWD/../tests/integration/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.102.1
      - name: Wait for collector health
        run: ../ci/wait-for-collector.sh
      - name: Run collector-backed OTLP smoke test
        run: npx vitest run tests/integration/otlp-collector.test.ts
        env:
          PROVIDE_TEST_OTLP_ENDPOINT: "http://127.0.0.1:4318"
          PROVIDE_TEST_OTLP_OUTPUT_DIR: "${{ github.workspace }}/tests/integration/otel-output-typescript"
      # Flush must put records on the wire without tearing providers down. Run
      # as a separate process that never calls shutdownTelemetry(), so anything
      # it lands in the collector can only have got there via flush — a case
      # inside the test above could not distinguish flush from shutdown's drain.
      - name: Run collector-backed flush probe
        run: npx tsx scripts/flush-collector-probe.ts
        env:
          PROVIDE_TEST_OTLP_ENDPOINT: "http://127.0.0.1:4318"
      - name: Collector logs
        if: always()
        run: docker logs otelcol-typescript || true
      - name: Capture collector logs
        run: docker logs otelcol-typescript > ../tests/integration/otel-output-typescript/collector.log 2>&1
      # Poll the collector log until every required signal name appears, with
      # a 30s deadline (see ci/verify-collector-signals.sh for rationale).
      - name: Verify collector exported all signals
        env:
          OTELCOL_CONTAINER: otelcol-typescript
        run: ../ci/verify-collector-signals.sh ../tests/integration/otel-output-typescript/collector.log
      # Names alone prove only that something arrived. This asserts the payload:
      # the right service resource, native trace/span correlation on log records,
      # and no internal library state exported as an attribute.
      - name: Verify collector content
        run: python3 ../ci/verify-collector-content.py ../tests/integration/otel-output-typescript/collector.log provide-telemetry-typescript-integration
      - name: Stop collector
        if: always()
        run: |
          docker stop otelcol-typescript || true
          docker rm otelcol-typescript || true
