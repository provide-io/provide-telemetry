name: 🧬 Mutation Testing

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/run_mutation_gate.py"
      - "scripts/_mutmut_shims/**"
      - "rust/src/**"
      - "rust/tests/**"
      - "rust/.cargo/mutants.toml"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "typescript/src/**"
      - "typescript/tests/**"
      - "typescript/package.json"
      - "typescript/package-lock.json"
      - "typescript/stryker.config.mjs"
      - "typescript/stryker.otel.config.mjs"
      - "go/**"
      - ".github/workflows/ci-mutation.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/run_mutation_gate.py"
      - "scripts/_mutmut_shims/**"
      - "rust/src/**"
      - "rust/tests/**"
      - "rust/.cargo/mutants.toml"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "typescript/src/**"
      - "typescript/tests/**"
      - "typescript/package.json"
      - "typescript/package-lock.json"
      - "typescript/stryker.config.mjs"
      - "typescript/stryker.otel.config.mjs"
      - "go/**"
      - ".github/workflows/ci-mutation.yml"
  workflow_dispatch:
  # Nightly and manual runs exercise every language even when no relevant diff
  # exists. Pull requests still block on each implementation surface they change.
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.filter.outputs.python }}
      typescript: ${{ steps.filter.outputs.typescript }}
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          fetch-depth: 0
      - name: Detect changed implementation surfaces
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          python=false
          typescript=false
          rust=false
          go=false

          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python=true
            typescript=true
            rust=true
            go=true
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"

            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            fi

            if [[ -z "${head}" ]] || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
              head="$(git rev-parse HEAD)"
            fi

            if [[ -z "${base}" || "${base}" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse "${head}^" 2>/dev/null || true)"
            fi

            if [[ -n "${base}" ]]; then
              changed_files="$(git diff --name-only "${base}" "${head}")"
            else
              changed_files="$(git ls-files)"
            fi

            while IFS= read -r changed_file; do
              [[ -z "${changed_file}" ]] && continue

              case "${changed_file}" in
                src/*|tests/*|pyproject.toml|scripts/run_mutation_gate.py|scripts/_mutmut_shims/*)
                  case "${changed_file}" in
                    tests/tooling/test_rust_*.py) ;;
                    *) python=true ;;
                  esac
                  ;;
              esac

              case "${changed_file}" in
                typescript/src/*|typescript/tests/*|typescript/package.json|typescript/package-lock.json|typescript/stryker.config.mjs|typescript/stryker.otel.config.mjs)
                  typescript=true
                  ;;
              esac

              case "${changed_file}" in
                rust/src/*|rust/tests/*|rust/.cargo/mutants.toml|rust/Cargo.toml|rust/Cargo.lock)
                  rust=true
                  ;;
              esac

              case "${changed_file}" in
                go/*) go=true ;;
              esac
            done <<< "${changed_files}"
          fi

          {
            echo "python=${python}"
            echo "typescript=${typescript}"
            echo "rust=${rust}"
            echo "go=${go}"
          } >> "${GITHUB_OUTPUT}"

  python-mutation:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8
        with:
          python-version: "3.11"
      - run: bash ci/run_uv_sync_with_retry.sh --group dev
      - run: uv run python scripts/run_mutation_gate.py --python-version 3.11 --retries 2 --max-children 1 --min-mutation-score 95

  typescript-mutation:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run test:mutation

  rust-mutation:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: rust-mutation (${{ matrix.shard }})
    # Every shard runs the full test suite for its disjoint candidate set. Eight
    # shards cover the complete inventory while keeping each blocking job below
    # the four-hour runaway cap.
    timeout-minutes: 240
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      # Pinned SHA of dtolnay/rust-toolchain `stable` branch HEAD as of 2026-04-18.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable@2026-04-18
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: rust
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.140 --locked
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      # Use nextest for the inner test runner and include all cargo features so
      # the mutation sweep exercises the OTEL-gated Rust surface as well as the
      # default governance build. A 300s floor avoids spurious timeouts on slow
      # CI hosts while still failing real surviving mutants.
      - name: Run cargo-mutants (100% kill rate required)
        env:
          # cargo-mutants relinks every test target for each mutation. Debug
          # symbols do not affect behavior and multiply link I/O substantially.
          CARGO_PROFILE_TEST_DEBUG: "0"
          # Bound compiler and test-runner fan-out independently. cargo-mutants'
          # worker count alone does not limit the child Cargo/Nextest processes.
          CARGO_BUILD_JOBS: "1"
          NEXTEST_TEST_THREADS: "1"
        run: cargo mutants --all-features --test-tool nextest --shard "${{ matrix.shard }}" -j 1 --jobserver-tasks 1 --no-shuffle --minimum-test-timeout 300 --timeout-multiplier 4

  go-mutation:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26"
      - name: Generate temporary go.work
        shell: bash
        run: |
          WORKFILE="$("$GITHUB_WORKSPACE/ci/init-go-workspace.sh" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/provide-telemetry-go-work")"
          echo "GOWORK=${WORKFILE}" >> "$GITHUB_ENV"
          export GOWORK="${WORKFILE}"
          echo "Using workspace: ${WORKFILE}"
          go env GOWORK
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      # Excluded comparison files contain mathematically equivalent mutations
      # (float64 exact equality P=0, nanosecond time boundary P≈0). The
      # declaration-only constants file is excluded because Go coverage starts
      # after package initialization; exact-value tests ratchet those constants.
      # Run each Go package surface explicitly:
      # - root package only (exclude sibling packages/modules and helper binaries)
      # - logger package
      # - optional go/otel module
      # Both surviving and uncovered mutants fail the job.
      - name: Run gremlins mutation tests for root package (100% kill rate required)
        run: |
          gremlins unleash \
            --workers=1 \
            --test-cpu=1 \
            --timeout-coefficient=30 \
            --threshold-efficacy=100 \
            --threshold-mcover=100 \
            --coverpkg="github.com/provide-io/provide-telemetry/go" \
            --exclude-files="sampling_cmp.go" \
            --exclude-files="resilience_cmp.go" \
            --exclude-files="mutation_constants.go" \
            --exclude-files="cmd/e2e_cross_language_client/" \
            --exclude-files="examples/" \
            --exclude-files="internal/" \
            --exclude-files="logger/" \
            --exclude-files="otel/" \
            --exclude-files="scripts/stress/" \
            .
      # No hashFiles() gate here: go/logger is a package of the root module, not
      # its own module, so gating on go/logger/go.mod would skip this step forever.
      - name: Run gremlins mutation tests for go/logger (100% kill rate required)
        run: |
          gremlins unleash \
            --workers=1 \
            --test-cpu=1 \
            --timeout-coefficient=30 \
            --threshold-efficacy=100 \
            --threshold-mcover=100 \
            --exclude-files="mutation_constants.go" \
            ./logger
      - name: Run gremlins mutation tests for go/otel (100% kill rate required)
        if: ${{ hashFiles('go/otel/go.mod') != '' }}
        working-directory: go/otel
        run: |
          # The standalone flush probe requires a live collector and is covered
          # by ci-go's collector-content gate, not the unit mutation runner.
          gremlins unleash \
            --workers=1 \
            --test-cpu=1 \
            --timeout-coefficient=30 \
            --threshold-efficacy=100 \
            --threshold-mcover=100 \
            --exclude-files="cmd/flush_collector_probe/" \
            --exclude-files="examples/" \
            .
