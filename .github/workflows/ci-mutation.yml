name: 🧬 Mutation Testing

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/run_mutation_gate.py"
      - "scripts/_mutmut_shims/**"
      - "rust/src/**"
      - "rust/tests/**"
      - "rust/.cargo/mutants.toml"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "typescript/src/**"
      - "typescript/tests/**"
      - "typescript/package.json"
      - "typescript/package-lock.json"
      - "typescript/stryker.config.mjs"
      - "typescript/stryker.otel.config.mjs"
      - "go/**"
      - "csharp/src/**"
      - "csharp/tests/**"
      - "csharp/stryker-config.json"
      - "csharp/.config/dotnet-tools.json"
      - ".github/workflows/ci-mutation.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/run_mutation_gate.py"
      - "scripts/_mutmut_shims/**"
      - "rust/src/**"
      - "rust/tests/**"
      - "rust/.cargo/mutants.toml"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "typescript/src/**"
      - "typescript/tests/**"
      - "typescript/package.json"
      - "typescript/package-lock.json"
      - "typescript/stryker.config.mjs"
      - "typescript/stryker.otel.config.mjs"
      - "go/**"
      - "csharp/src/**"
      - "csharp/tests/**"
      - "csharp/stryker-config.json"
      - "csharp/.config/dotnet-tools.json"
      - ".github/workflows/ci-mutation.yml"
  workflow_dispatch:
  # Nightly and manual runs exercise every language even when no relevant diff
  # exists. Pull requests still block on each implementation surface they change.
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.filter.outputs.python }}
      typescript: ${{ steps.filter.outputs.typescript }}
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      csharp: ${{ steps.filter.outputs.csharp }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          fetch-depth: 0
      - name: Detect changed implementation surfaces
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          python=false
          typescript=false
          rust=false
          go=false
          csharp=false

          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python=true
            typescript=true
            rust=true
            go=true
            csharp=true
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"

            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            fi

            if [[ -z "${head}" ]] || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
              head="$(git rev-parse HEAD)"
            fi

            if [[ -z "${base}" || "${base}" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse "${head}^" 2>/dev/null || true)"
            fi

            if [[ -n "${base}" ]]; then
              changed_files="$(git diff --name-only "${base}" "${head}")"
            else
              changed_files="$(git ls-files)"
            fi

            while IFS= read -r changed_file; do
              [[ -z "${changed_file}" ]] && continue

              case "${changed_file}" in
                src/*|tests/*|pyproject.toml|scripts/run_mutation_gate.py|scripts/_mutmut_shims/*)
                  case "${changed_file}" in
                    tests/tooling/test_rust_*.py) ;;
                    *) python=true ;;
                  esac
                  ;;
              esac

              case "${changed_file}" in
                typescript/src/*|typescript/tests/*|typescript/package.json|typescript/package-lock.json|typescript/stryker.config.mjs|typescript/stryker.otel.config.mjs)
                  typescript=true
                  ;;
              esac

              case "${changed_file}" in
                rust/src/*|rust/tests/*|rust/.cargo/mutants.toml|rust/Cargo.toml|rust/Cargo.lock)
                  rust=true
                  ;;
              esac

              case "${changed_file}" in
                go/*) go=true ;;
              esac

              # Only the two mutated projects, their tests, and the Stryker
              # configuration/tool pin affect the C# score. Probes, examples and
              # consumer smoke projects are in the solution but are not mutated.
              case "${changed_file}" in
                csharp/src/*|csharp/tests/*|csharp/stryker-config.json|csharp/.config/dotnet-tools.json)
                  csharp=true
                  ;;
              esac
            done <<< "${changed_files}"
          fi

          {
            echo "python=${python}"
            echo "typescript=${typescript}"
            echo "rust=${rust}"
            echo "go=${go}"
            echo "csharp=${csharp}"
          } >> "${GITHUB_OUTPUT}"

  python-mutation:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8
        with:
          python-version: "3.11"
      - run: bash ci/run_uv_sync_with_retry.sh --group dev
      - run: uv run python scripts/run_mutation_gate.py --python-version 3.11 --retries 2 --max-children 1 --min-mutation-score 95

  typescript-mutation:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run test:mutation

  rust-mutation:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: rust-mutation (${{ matrix.shard }})
    # Every shard runs the full test suite for its disjoint candidate set. Eight
    # shards cover the complete inventory while keeping each blocking job below
    # the four-hour runaway cap.
    timeout-minutes: 240
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      # Pinned SHA of dtolnay/rust-toolchain `stable` branch HEAD as of 2026-04-18.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable@2026-04-18
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: rust
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.140 --locked
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      # Use nextest for the inner test runner and include all cargo features so
      # the mutation sweep exercises the OTEL-gated Rust surface as well as the
      # default governance build. A 300s floor avoids spurious timeouts on slow
      # CI hosts while still failing real surviving mutants.
      - name: Run cargo-mutants (100% kill rate required)
        env:
          # cargo-mutants relinks every test target for each mutation. Debug
          # symbols do not affect behavior and multiply link I/O substantially.
          CARGO_PROFILE_TEST_DEBUG: "0"
          # Bound compiler and test-runner fan-out independently. cargo-mutants'
          # worker count alone does not limit the child Cargo/Nextest processes.
          CARGO_BUILD_JOBS: "1"
          NEXTEST_TEST_THREADS: "1"
        # --in-place, not the default copy-to-scratch. Three tests read
        # spec/*.yaml through concat!(env!("CARGO_MANIFEST_DIR"), "/../spec/…"),
        # which resolves at compile time — inside a copied crate that path does
        # not exist, cargo test fails in the unmutated tree, and cargo-mutants
        # exits having tested zero mutants. It reports that as an error, but it
        # is easy to read as a pass in a log. Testing in the source tree lets
        # those tests find the spec they are validating against.
        #
        # -j is dropped because cargo-mutants refuses it alongside --in-place;
        # CARGO_BUILD_JOBS and NEXTEST_TEST_THREADS above already bound fan-out.
        run: cargo mutants --in-place --all-features --test-tool nextest --shard "${{ matrix.shard }}" --jobserver-tasks 1 --no-shuffle --minimum-test-timeout 300 --timeout-multiplier 4

  go-mutation:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26"
      - name: Generate temporary go.work
        shell: bash
        run: |
          WORKFILE="$("$GITHUB_WORKSPACE/ci/init-go-workspace.sh" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/provide-telemetry-go-work")"
          echo "GOWORK=${WORKFILE}" >> "$GITHUB_ENV"
          export GOWORK="${WORKFILE}"
          echo "Using workspace: ${WORKFILE}"
          go env GOWORK
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      # Excluded comparison files contain mathematically equivalent mutations
      # (float64 exact equality P=0, nanosecond time boundary P≈0). The
      # declaration-only constants file is excluded because Go coverage starts
      # after package initialization; exact-value tests ratchet those constants.
      # Run each Go package surface explicitly:
      # - root package only (exclude sibling packages/modules and helper binaries)
      # - logger package
      # - optional go/otel module
      # Both surviving and uncovered mutants fail the job — but only because
      # each run goes through scripts/run_gremlins_gate.sh. gremlins' own
      # --threshold-efficacy / --threshold-mcover flags do not gate: v0.6.0
      # exits 0 even when asked for an impossible 101%, so these steps passed
      # unconditionally before the wrapper. The flags are kept for the numbers
      # they print in the log.
      #
      # --timeout-coefficient=100, not the 30 this used to carry. The wrapper
      # fails on a timed-out mutant, and rightly so — an abandoned mutant was
      # never decided, so counting it as killed would be a guess. But the root
      # package runs in 0.445s, which at 30 gave each mutant ~13s, and two
      # mutants sit just past that: negating the exporter-validation guards in
      # runtime_validate.go:30 and config_env_exporter.go:100 lets an invalid
      # policy reach live code, and the tests then spend real time in retry
      # backoff. Two consecutive local runs each timed out on one of those two,
      # a different one each time, so the gate failed on jitter rather than on
      # anything about the code. At 100 both are decided and killed: 610
      # mutants, lived=0 not_covered=0 timed_out=0, efficacy and mutator
      # coverage 100.00%. This raises how long a mutant may take to be judged;
      # it does not lower the bar, which is still zero survivors.
      - name: Run gremlins mutation tests for root package (100% kill rate required)
        run: |
          "$GITHUB_WORKSPACE/scripts/run_gremlins_gate.sh" \
            --workers=1 \
            --test-cpu=1 \
            --timeout-coefficient=100 \
            --threshold-efficacy=100 \
            --threshold-mcover=100 \
            --coverpkg="github.com/provide-io/provide-telemetry/go" \
            --exclude-files="sampling_cmp.go" \
            --exclude-files="resilience_cmp.go" \
            --exclude-files="mutation_constants.go" \
            --exclude-files="cmd/e2e_cross_language_client/" \
            --exclude-files="examples/" \
            --exclude-files="internal/" \
            --exclude-files="logger/" \
            --exclude-files="otel/" \
            --exclude-files="scripts/stress/" \
            .
      # No hashFiles() gate here: go/logger is a package of the root module, not
      # its own module, so gating on go/logger/go.mod would skip this step forever.
      - name: Run gremlins mutation tests for go/logger (100% kill rate required)
        run: |
          "$GITHUB_WORKSPACE/scripts/run_gremlins_gate.sh" \
            --workers=1 \
            --test-cpu=1 \
            --timeout-coefficient=100 \
            --threshold-efficacy=100 \
            --threshold-mcover=100 \
            --exclude-files="mutation_constants.go" \
            ./logger
      - name: Run gremlins mutation tests for go/otel (100% kill rate required)
        if: ${{ hashFiles('go/otel/go.mod') != '' }}
        working-directory: go/otel
        run: |
          # The standalone flush probe requires a live collector and is covered
          # by ci-go's collector-content gate, not the unit mutation runner.
          "$GITHUB_WORKSPACE/scripts/run_gremlins_gate.sh" \
            --workers=1 \
            --test-cpu=1 \
            --timeout-coefficient=100 \
            --threshold-efficacy=100 \
            --threshold-mcover=100 \
            --exclude-files="cmd/flush_collector_probe/" \
            --exclude-files="examples/" \
            .

  csharp-mutation:
    needs: changes
    if: needs.changes.outputs.csharp == 'true'
    # The measured baseline is 33 minutes of wall clock at concurrency 2 on a
    # workstation; a shared runner is slower, and a hang would otherwise burn
    # the six-hour default.
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "10.0.x"
      # The Stryker version is pinned in csharp/.config/dotnet-tools.json rather
      # than installed ad hoc, so the score this job reports is reproducible: a
      # new Stryker minor adds mutators, which moves the denominator and would
      # look like a regression against a fixed threshold.
      - name: Restore pinned local tools
        run: dotnet tool restore
      # Stryker builds the solution itself, but building first surfaces a
      # compile break as a build failure rather than as "Stryker failed to
      # mutate your project", and keeps the warnings-as-errors contract that
      # ci-csharp.yml enforces applying to the mutation job too.
      - name: Build (warnings as errors)
        run: dotnet build Provide.Telemetry.sln -warnaserror -m:1
      # Thresholds live in csharp/stryker-config.json (break 78 against a
      # measured 79.41 % on 2026-08-08) together with the reasoning for that
      # number and what it would take to raise it. Unlike the Go gate, no
      # wrapper script is needed: Stryker exits 2 of its own accord when the
      # score falls below break, which the falsifiability check on this gate
      # confirmed by weakening a single assertion.
      - name: Run Stryker.NET mutation tests
        run: dotnet stryker --skip-version-check
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: csharp-mutation-report
          path: csharp/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore
