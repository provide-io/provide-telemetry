# Dependabot version updates — manual-only.
# open-pull-requests-limit: 0 suppresses automatic PRs. schedule.interval is
# still required by GitHub's schema but produces no PRs while the limit is 0.
#
# When you want updates:
#   1. Insights → Dependency graph → Dependabot → "Check for updates", or
#   2. Temporarily raise open-pull-requests-limit (e.g. 10), commit, then set
#      it back to 0 after PRs land.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: ["dependencies", "python"]

  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: ["dependencies", "typescript"]

  - package-ecosystem: gomod
    directories: ["/go", "/go/otel", "/go/cmd/e2e_cross_language_client"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # The modules require each other through replace directives; their own
    # versions move with VERSION, not with Dependabot.
    ignore:
      - dependency-name: "github.com/provide-io/provide-telemetry/*"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: ["dependencies", "go"]

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: ["dependencies", "rust"]

  - package-ecosystem: nuget
    directory: /csharp
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: ["dependencies", "csharp"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
